name: Build
on:
  push:
    branches: [main]
  pull_request:
env:
  NODE_ENV: test
  TZ: UTC
  PORT: 3333
  HOST: localhost
  LOG_LEVEL: info
  APP_KEY: ci-only-app-key-ci-only-app-key-0123456789
  APP_URL: http://localhost:3333
  SESSION_DRIVER: memory
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_USER: ytboxd
  DB_PASSWORD: ytboxd
  DB_DATABASE: ytboxd
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ytboxd
          POSTGRES_PASSWORD: ytboxd
          POSTGRES_DB: ytboxd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ytboxd -d ytboxd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: node ace build
      - name: Migrations
        run: node ace migration:run --force
      - name: Testes
        run: node ace test
