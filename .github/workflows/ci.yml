name: Build
# Gatilho do pipeline
on:
  push:
    branches: [main] # Nesse caso, sempre quando tivermos um push para a main vai rodar
  pull_request: # E quando um pull-request é aberto

# Definindo o que será feito
jobs:
  build: # No nosso caso será só o build, podemos adicionar mais coisas aqui futuramente, mas só estamos testando se está subindo a aplicação sem problemas. TODO: Adicionar testes unitários + teste em subir o banco
    runs-on: ubuntu-latest # Sobre em que OS roda
    steps: # Os passos do build, se um falhar reporta
      - uses: actions/checkout@v4 # Isso aqui usa um código já feito por outra pessoa. Copia o nosso código para dentro de uma VM hosteada pelo próprio Github

      - uses: actions/setup-node@v4 # Instala o node.js na máquina VM
        with:
          node-version: 20
          cache: npm

      - run: npm ci # Instala as dependências que estão no nosso .json package lá
      # - name: Rótulo que aparece no github
      - name: Build
        run: node ace build # Como se trata de um código feito por nós, usamos o run. Apenas sobe a aplicação
